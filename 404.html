<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Page introuvable — BACKPACK LAB</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/bp-favicon-32.png" />
<link rel="icon" type="image/x-icon" href="/assets/bp-favicon.ico" />
<link rel="apple-touch-icon" href="/assets/bp-apple-touch-icon.png" />
<link href="/assets/fonts/inter.css" rel="stylesheet" />
<style>
  :root{--bg:#0B0B0B;--surface:#141417;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);--accent:#35DC8E;--accent2:#5FE8A8;--text:#FFF;--muted:#9A9A9E;--muted2:#6E6E73;--on-accent:#04150C}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px;width:100%}
  nav{border-bottom:1px solid var(--line);background:rgba(11,11,11,.8)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:64px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.5px;font-size:20px}
  .brand img{width:42px;height:42px}
  @media(max-width:600px){.brand{font-size:17px;gap:10px}.brand img{width:36px;height:36px}}
  @media(max-width:380px){.brand{font-size:15px;gap:8px}.brand img{width:32px;height:32px}}
  @media(max-width:340px){.brand{font-size:14px;gap:6px}.brand img{width:30px;height:30px}}
  .lang{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
  .lang button{background:transparent;border:0;color:var(--muted);font-size:12px;font-weight:600;padding:5px 9px;cursor:pointer;font-family:inherit}
  .lang button.on{background:var(--accent);color:var(--on-accent)}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 0}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:44px 32px;max-width:520px;width:100%;margin:0 auto;text-align:center}
  .code{font-size:64px;font-weight:800;letter-spacing:-2px;line-height:1;color:var(--accent);margin-bottom:14px}
  h1{font-size:24px;font-weight:800;letter-spacing:-.4px;margin-bottom:10px}
  p{color:var(--muted);font-size:15px}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
  .btn{display:inline-flex;border-radius:10px;font-weight:600;font-size:14px;padding:11px 20px;background:var(--accent);color:var(--on-accent)}
  .btn:hover{background:var(--accent2)}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2)}
  .btn.ghost:hover{background:rgba(255,255,255,.05)}
  .small{margin-top:22px;font-size:12.5px;color:var(--muted2)}
  .small a{text-decoration:underline}
</style>
</head>
<body>
<nav>
  <div class="wrap nav-in">
    <a class="brand" href="/"><img src="/assets/bp-mark.png" alt="" />BACKPACK&nbsp;LAB</a>
    <div class="lang"><button id="lfr" class="on" type="button">FR</button><button id="len" type="button">EN</button></div>
  </div>
</nav>
<main>
  <div class="wrap">
    <div class="card">
      <div class="code">404</div>
      <h1 data-fr="Page introuvable" data-en="Page not found">Page introuvable</h1>
      <p data-fr="Cette page n'existe pas ou a été déplacée." data-en="This page doesn't exist or has been moved.">Cette page n'existe pas ou a été déplacée.</p>
      <div class="row">
        <a class="btn" href="/" data-fr="Retour à l'accueil" data-en="Back to home">Retour à l'accueil</a>
        <a class="btn ghost" href="/rushr" data-fr="Découvrir Rushr" data-en="Discover Rushr">Découvrir Rushr</a>
      </div>
      <div class="small"><span data-fr="Un problème ? " data-en="Something wrong? ">Un problème ? </span><a href="mailto:contact@thebackpacklab.com">contact@thebackpacklab.com</a></div>
    </div>
  </div>
</main>
<script>
  (function(){
    var lang='fr';
    try{ lang=localStorage.getItem('bpl_lang')||''; }catch(e){}
    if(lang!=='fr'&&lang!=='en') lang=((navigator.language||'fr').toLowerCase().indexOf('fr')===0)?'fr':'en';
    function apply(l){
      document.documentElement.lang=l;
      document.title=l==='en'?'Page not found — BACKPACK LAB':'Page introuvable — BACKPACK LAB';
      var els=document.querySelectorAll('[data-fr]');
      for(var i=0;i<els.length;i++) els[i].textContent=els[i].getAttribute('data-'+l);
      document.getElementById('lfr').className=l==='fr'?'on':'';
      document.getElementById('len').className=l==='en'?'on':'';
      try{ localStorage.setItem('bpl_lang',l); }catch(e){}
    }
    document.getElementById('lfr').addEventListener('click',function(){apply('fr');});
    document.getElementById('len').addEventListener('click',function(){apply('en');});
    apply(lang);
  })();
</script>
</body>
</html>
